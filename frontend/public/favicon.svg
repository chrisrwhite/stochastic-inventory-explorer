<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Stochastic Inventory Explorer">
  <title>Stochastic Inventory Explorer</title>
  <!-- Rounded dark tile so the icon reads on both light and dark browser tabs -->
  <rect width="32" height="32" rx="7" fill="hsl(222, 47%, 11%)"/>

  <!-- Faint axes -->
  <path d="M7 25 H26" stroke="hsl(215, 20%, 55%)" stroke-width="1" stroke-linecap="round" opacity="0.55"/>
  <path d="M7 6 V25"  stroke="hsl(215, 20%, 55%)" stroke-width="1" stroke-linecap="round" opacity="0.55"/>

  <!-- Efficient frontier: cheap+low-reliability at bottom-left, stepping up to the recommended dot -->
  <path d="M7 22 L12 22 L12 17 L18 17 L18 11 L24 11"
        fill="none"
        stroke="hsl(160, 65%, 55%)"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- A couple of dominated candidate dots to hint at the scatter -->
  <circle cx="13" cy="25" r="1.2" fill="hsl(215, 80%, 65%)" opacity="0.75"/>
  <circle cx="20" cy="21" r="1.2" fill="hsl(215, 80%, 65%)" opacity="0.75"/>

  <!-- Recommended policy: bright green dot with dark ring, sits on the frontier -->
  <circle cx="24" cy="11" r="3.5" fill="hsl(160, 84%, 45%)" stroke="hsl(160, 84%, 22%)" stroke-width="1.2"/>
</svg>
